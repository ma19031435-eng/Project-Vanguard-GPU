<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanguard Tactical Auth Bridge</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090e;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background-image: 
        radial-gradient(ellipse at 50% 10%, rgba(6, 182, 212, 0.15) 0%, transparent 60%),
        linear-gradient(to bottom, #090d16, #05070a);
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 19, 32, 0.95);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.2), 0 20px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #22d3ee;
      border-radius: 50%;
      box-shadow: 0 0 8px #22d3ee;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .domain-tag {
      display: inline-block;
      background: rgba(0, 0, 0, 0.5);
      border: 1px dashed rgba(6, 182, 212, 0.4);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      word-break: break-all;
      margin-top: 4px;
    }
    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
    }
    .btn-google:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
    }
    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      min-height: 1.2rem;
      color: #38bdf8;
    }
    .error {
      color: #f87171;
    }
    .success {
      color: #4ade80;
    }
    .footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #fff;
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>AUTHORIZED SECURE BRIDGE</span>
    </div>
    <h1>PROJECT VANGUARD</h1>
    <p>
      Authenticating session for:<br>
      <span class="domain-tag" id="originDisplay">ominx-vanguard-fps.ai.studio</span>
    </p>

    <button id="loginBtn" class="btn-google" onclick="startGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>CONTINUE WITH GOOGLE</span>
    </button>

    <div id="status" class="status">Click button above to sign in</div>

    <div class="footer">
      <span>SECURE HANDSHAKE</span>
      <button class="close-btn" onclick="window.close()">CANCEL</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetOrigin = urlParams.get('origin') || 'https://ominx-vanguard-fps.ai.studio';
    const autoTrigger = urlParams.get('auto') === '1';

    try {
      const url = new URL(targetOrigin);
      document.getElementById('originDisplay').textContent = url.hostname;
    } catch {
      document.getElementById('originDisplay').textContent = targetOrigin;
    }

    const firebaseConfig = {
      projectId: "mindful-quartet-tjq9c",
      appId: "1:441693298806:web:e072a00b7c1eb5e737ff57",
      apiKey: "AIzaSyBmQBePR7YsMqJMGZkQFzlGnGeFF4VVfRU",
      authDomain: "mindful-quartet-tjq9c.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-projectvanguardg-59edbfde-ba43-4235-8701-f44f273bbec6",
      storageBucket: "mindful-quartet-tjq9c.firebasestorage.app",
      messagingSenderId: "441693298806",
      oAuthClientId: "441693298806-jqqt0tbl8bnmlm9fagu949pptcskotsn.apps.googleusercontent.com"
    };

    firebase.initializeApp(firebaseConfig);

    async function startGoogleAuth() {
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Connecting to Google Identity...';

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('profile');
        provider.addScope('email');
        provider.setCustomParameters({ prompt: 'select_account' });

        const result = await firebase.auth().signInWithPopup(provider);
        const credential = result.credential;
        const idToken = credential ? credential.idToken : null;
        const accessToken = credential ? credential.accessToken : null;
        const user = result.user;

        statusEl.className = 'status success';
        statusEl.textContent = 'Verified as ' + (user.displayName || user.email) + '! Linking session...';

        if (window.opener) {
          window.opener.postMessage({
            type: 'VANGUARD_AUTH_BRIDGE_SUCCESS',
            idToken: idToken,
            accessToken: accessToken,
            uid: user.uid,
            displayName: user.displayName,
            email: user.email,
            photoURL: user.photoURL
          }, '*');

          setTimeout(() => {
            window.close();
          }, 900);
        } else {
          statusEl.textContent = 'Success! You can return to Vanguard.';
        }
      } catch (err) {
        console.error('Bridge auth failed:', err);
        statusEl.className = 'status error';
        statusEl.textContent = err.message || 'Google authentication failed.';
        btn.disabled = false;

        if (window.opener) {
          window.opener.postMessage({
            type: 'VANGUARD_AUTH_BRIDGE_ERROR',
            error: err.message || 'Authentication error',
            code: err.code || 'unknown'
          }, '*');
        }
      }
    }

    if (autoTrigger) {
      setTimeout(() => {
        startGoogleAuth();
      }, 300);
    }
  </script>
</body>
</html>
